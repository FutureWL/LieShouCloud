# docker profile - 容器内运行时使用
# DB host=postgres (compose service name); 用户名/密码/库名由 .env 注入
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:lieshoucloudpro}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  # 种子数据（ADR-0027）：docker profile 额外启用 classpath:db/seed（如 R__seed_admin）
  flyway:
    locations: classpath:db/user-migration,classpath:db/seed
    # 全新库多服务并发启动时共享 public schema 存在启动竞态（user 必须最先迁移，
    # 见 OPERATIONS/MEMORY 坑位记录）。baseline-on-migrate + baseline-version 0
    # 使 user 在「库非空但无自身 history」时自动 baseline 并补跑全部迁移，彻底消除竞态；
    # 已有 history 的库（dev）不触发 baseline，行为不变。
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    cn.huntercat.lieshoucloudpro.user: DEBUG
