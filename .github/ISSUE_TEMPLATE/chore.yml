name: "Chore 杂项"
description: 技术债 / 升级 / 重构（PROJECT_MANAGEMENT.md §5）
title: "chore: "
labels: [chore]
body:
  - type: markdown
    attributes:
      value: |
        ## Chore 模板（PROJECT_MANAGEMENT.md §5）
        无用户可见行为的工程变更走这里。
  - type: textarea
    id: current
    attributes:
      label: 当前现状
      description: 现在是什么样的？痛点 / 债在哪里
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 改成什么样 / 升级到什么版本
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: 工作量（小时）
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options: [P0, P1, P2]
    validations:
      required: true
